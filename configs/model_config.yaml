# ====================================================================
# PRETEXT / DOMAIN-BASED PRETRAINING MODEL CONFIGURATION
# ====================================================================

PRETRAIN:

  MODEL:
    NAME: 'CF-MAE'   # Change-Fused Masked Autoencoder
    TYPE: 'MAE'
    TOTAL_PARAMS: ~97M

    ENCODER:
      BACKBONE: vit_base_patch16_224
      IMG_SIZE: 224
      IN_CHANNELS: 3
      PATCH_SIZE: 16
      EMBED_DIM: 768
      NUM_LAYERS: 12
      NUM_HEADS: 12
      MLP_RATIO: 4.
      QKV_BAIS: True
      DROP_OUT: 0.
      DROP_PATH: 0.1  # stochastic depth

    DECODER:

    MASKING:
      MASK_RATIO: 0.75
      MASK_STRATEGY: random

    FUSION:
      TYPE: change fusion
      MODALITIES: [optical, sar]

    # TRAINING CONFIG [ Based from SimMIM codebase - https://github.com/microsoft/SimMIM ]
  TRAINING:
    START_EPOCH: 0
    TOTAL_EPOCHS: 200
    WARMUP_EPOCHS: 20
    AUTO_RESUME: True
    WEIGHT_DECAY: 0.05
    LEARNING_RATE: 5e-4
    WARMUP_LR: 5e-7
    MIN_LR: 5e-6
    GRAD_CLIP: 5.0

    PRINT_FREQ: 10

    # Optimizer
    OPTIMIZER: adamw
    EPS: 1e-8
    BETAS: (0.9, 0.999)
    MOMENTUM: 0.9

    # Scheduler
    SCHEDULER: cosine

    STEP_SIZE: 30   # ONLY FOR STEP SCHEDULER
    GAMMA: 0.1      # ONLY FOR STEP SCHEDULER

    # Path to save the trained CF-MAE
    CHECKPOINT_PATH: ''
