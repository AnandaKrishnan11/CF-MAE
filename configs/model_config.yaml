# ====================================================================
# PRETEXT / DOMAIN-BASED PRETRAINING MODEL CONFIGURATION
# ====================================================================

pretrain:

  model:
    name: CF-MAE                    # Change-Fused Masked Autoencoder
    type: mae                       # Self-supervised masked autoencoder

    encoder:
      backbone: vit_base_patch16_224
      img_size: 224
      in_channels: 3
      patch_size: 16
      embed_dim: 768
      num_layers: 12                # transformer blocks/depth
      num_heads: 12

      drop_path: 0.1                # stochastic depth 

    decoder:

    masking:
      mask_ratio: 0.75             
      mask_strategy: random         

    fusion:
      type: change fusion         
      modalities: [optical, sar]    

    # TRAINING CONFIG
    training:
      epochs: 200
      warmup_epochs: 20
      auto_Resume: True
      weight_decay: 0.05
      learning_rate: 5e-4
      warmup_lr: 5e-7
      min_lr: 5e-6

      #Optimizer
      optimizer: adamw
      eps: 1e-8
      betas: (0.9, 0.999)
      momentum: 0.9
      
      #Scheduler
      scheduler: cosine

      step_size: 10 #ONLY FOR STEP SCHEDULER
      gamma: 0.1 #ONLY FOR STEP SCHEDULER


