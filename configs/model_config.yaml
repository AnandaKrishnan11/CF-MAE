#############################################################################
#PRETRAIN CONFIGURATIONS
#############################################################################

PRETRAIN:
  NAME: CF_MAE
  TYPE: MAE
  ENCODER:
    BACKBONE: vit_base_patch16_224
    IMG_SIZE: 224 
    IN_CHANNELS: 3 
    PATCH_SIZE: 16
    EMBED_DIM: 768
    DROP_OUT: 0.0
    DROP_PATH: 0.1
  MASKING:
    MASK_RATIO: 0.75
  TRAINING:
    START_EPOCH: 0
    TOTAL_EPOCHS: 200
    WARMUP_EPOCHS: 10
    AUTO_RESUME: True
    WEIGHT_DECAY: 0.02
    LEARNING_RATE: 1e-4
    WARMUP_LR: 1e-7
    MIN_LR: 1e-6
    GRAD_CLIP: 5.0
    ACCUMULATION_STEPS: 8
    PRINT_FREQ: 10
    OPTIMIZER: adamw
    EPS: 1e-8
    BETAS:
    - 0.9
    - 0.999
    MOMENTUM: 0.9
    SCHEDULER: cosine
    STEP_SIZE: 30
    GAMMA: 0.1
    LOGGER_PATH: /media/krishnan/GFM/Checkpoint_hub
    BEST_CHECKPOINT_PATH: /media/krishnan/GFM/Checkpoint_hub/best_chk_pt.pth
    LAST_CHECKPOINT_PATH: /media/krishnan/GFM/Checkpoint_hub/last_chk_pt.pth

#############################################################################
#FINETUNE CONFIGURATIONS
#############################################################################

FINETUNE:
  NAME: CFT4Segm
  TYPE: Segmentation
  VERSION: v2
  ENCODER:
    BACKBONE: vit_base_patch16_224
    IMG_SIZE: 224
    IN_CHANNELS: 3
    PATCH_SIZE: 16
    EMBED_DIM: 768
    DROP_OUT: 0.1
    DROP_PATH: 0.1
  DECODER: 
    EMBED_DIM: 768
    OUT_IMG_SIZE: 224
    OUT_CHANNEL: 1
  TRAINING:
    START_EPOCH: 0
    TOTAL_EPOCHS: 50
    WARMUP_EPOCHS: 5
    AUTO_RESUME: true
    WEIGHT_DECAY: 0.02
    LEARNING_RATE: 5e-5
    WARMUP_LR: 1e-6
    MIN_LR: 1e-6
    ENCODER_LR_MULT: 0.05 # Encoder: 10% of base LR
    CHANGE_ENCODER_LR_MULT: 1.0 # Change encoders: 50% of base LR
    DECODER_EMBED_LR_MULT: 1.0 # Decoder embed: 50% of base LR
    DECODER_LR_MULT: 1.0 # Decoder: 100% of base LR
    GRAD_CLIP: 1.0
    ACCUMULATION_STEPS: 0
    PRINT_FREQ: 20
    OPTIMIZER: adamw
    EPS: 1e-8
    BETAS:
    - 0.9
    - 0.999
    MOMENTUM: 0.9
    SCHEDULER: cosine
    STEP_SIZE: 30
    GAMMA: 0.1
    PATIENCE: 50 #No patience used during training
    LOGGER_PATH: /media/krishnan/GFM/Checkpoint_hub
    BEST_CHECKPOINT_PATH: /media/krishnan/GFM/Checkpoint_hub/best_chk_pt.pth
    LAST_CHECKPOINT_PATH: /media/krishnan/GFM/Checkpoint_hub/last_chk_pt.pth
    PRETRAINED_WEIGHT: /media/krishnan/GFM/Checkpoint_hub/main_checkpoint/best_chk_pt.pth

